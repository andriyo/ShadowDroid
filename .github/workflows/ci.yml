name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust CLI (pinned)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Cargo 1.97+ applies this consistently to every rustc invocation, unlike
      # command-specific trailing `-D warnings` arguments.
      CARGO_BUILD_WARNINGS: deny
    steps:
      - uses: actions/checkout@v6

      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt --component clippy

      - name: Check formatting
        working-directory: cli
        run: cargo +1.97.0 fmt --all -- --check

      - name: Lint
        working-directory: cli
        run: cargo +1.97.0 clippy --locked --all-targets --all-features

      - name: Test
        working-directory: cli
        run: cargo +1.97.0 test --locked --all-targets

      - name: Build CLI for Android journeys
        working-directory: cli
        run: cargo +1.97.0 build --locked

      - uses: actions/upload-artifact@v7
        with:
          name: ci-linux-cli
          path: cli/target/debug/shadowdroid
          if-no-files-found: error

  rust-msrv:
    name: Rust CLI (MSRV 1.91)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install minimum supported Rust
        run: rustup toolchain install 1.91.0 --profile minimal

      - name: Check minimum supported Rust
        working-directory: cli
        run: cargo +1.91.0 check --locked --all-targets --all-features

  rust-latest:
    name: Rust CLI (latest stable)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install latest stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Check forward compatibility
        working-directory: cli
        run: cargo +stable check --locked --all-targets --all-features

  rust-platforms:
    name: Rust CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_WARNINGS: deny
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - windows-2025
    steps:
      - uses: actions/checkout@v6

      - name: Install pinned Rust
        run: rustup toolchain install 1.97.0 --profile minimal

      - name: Check platform-specific code
        working-directory: cli
        run: cargo +1.97.0 check --locked --all-targets --all-features

  server:
    name: Android server
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36"

      - uses: gradle/actions/setup-gradle@v6

      - name: Check, test, and assemble server APK pair
        working-directory: server
        run: |
          ./gradlew --no-daemon \
            ktlintCheck \
            :app:lintDebug \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            :app:assembleDebugAndroidTest

      - name: Stage server APK pair for Android journeys
        run: |
          mkdir -p ci-artifacts/server
          cp server/app/build/outputs/apk/debug/app-debug.apk \
            ci-artifacts/server/app-debug.apk
          cp server/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            ci-artifacts/server/app-debug-androidTest.apk

      - uses: actions/upload-artifact@v7
        with:
          name: ci-server-apks
          path: ci-artifacts/server/*.apk
          if-no-files-found: error

  server-instrumented:
    name: Android server instrumentation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run every server instrumentation test on an emulator
        uses: reactivecircus/android-emulator-runner@v2.37.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          working-directory: server
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest

  agent-and-sample:
    name: In-app agent and sample app
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36"

      - uses: gradle/actions/setup-gradle@v6

      - name: Check, test, and assemble in-app agent
        working-directory: agent
        run: |
          ./gradlew --no-daemon \
            :shadowdroid-agent:lintDebug \
            :shadowdroid-agent:testDebugUnitTest \
            :shadowdroid-agent:assembleRelease \
            :shadowdroid-agent-okhttp:lintDebug \
            :shadowdroid-agent-okhttp:testDebugUnitTest \
            :shadowdroid-agent-okhttp:assembleRelease

      - name: Stage the agent AARs used by the sample
        run: |
          mkdir -p samples/shadowdroid-test-app/shadowdroid
          cp agent/shadowdroid-agent/build/outputs/aar/shadowdroid-agent-release.aar \
            samples/shadowdroid-test-app/shadowdroid/shadowdroid-agent.aar
          cp agent/shadowdroid-agent-okhttp/build/outputs/aar/shadowdroid-agent-okhttp-release.aar \
            samples/shadowdroid-test-app/shadowdroid/shadowdroid-agent-okhttp.aar

      - name: Check, test, and assemble sample app
        working-directory: samples/shadowdroid-test-app
        run: |
          ./gradlew --no-daemon \
            :app:lintDebug \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            :app:assembleRelease

      - name: Stage sample APK for Android journeys
        run: |
          mkdir -p ci-artifacts/sample
          cp samples/shadowdroid-test-app/app/build/outputs/apk/debug/app-debug.apk \
            ci-artifacts/sample/app-debug.apk

      - uses: actions/upload-artifact@v7
        with:
          name: ci-field-lab-apk
          path: ci-artifacts/sample/app-debug.apk
          if-no-files-found: error

  android-surfaces:
    name: Android agent surfaces (${{ matrix.name }})
    needs:
      - rust
      - server
      - agent-and-sample
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: phone-api-36
            api-level: 36
            target: google_apis
            form-factor: phone
          - name: tv-api-36
            api-level: 36
            target: android-tv
            form-factor: tv
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: ci-linux-cli
          path: ci-artifacts/cli

      - uses: actions/download-artifact@v8
        with:
          name: ci-server-apks
          path: ci-artifacts/server

      - uses: actions/download-artifact@v8
        with:
          name: ci-field-lab-apk
          path: ci-artifacts/sample

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Exercise the real CLI, APK pair, and Field Lab
        uses: reactivecircus/android-emulator-runner@v2.37.0
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          script: |
            chmod +x ci-artifacts/cli/shadowdroid
            SHADOWDROID_CLI_BIN="$PWD/ci-artifacts/cli/shadowdroid" \
              SHADOWDROID_SERVER_TEST_APK="$PWD/ci-artifacts/server/app-debug-androidTest.apk" \
              SHADOWDROID_SAMPLE_APK="$PWD/ci-artifacts/sample/app-debug.apk" \
              SHADOWDROID_DEVICE=emulator-5554 \
              SHADOWDROID_EXPECT_FORM_FACTOR=${{ matrix.form-factor }} \
              SHADOWDROID_E2E_EVIDENCE="$RUNNER_TEMP/android-surfaces-${{ matrix.name }}" \
              ./scripts/e2e-android-surfaces.sh

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-surfaces-${{ matrix.name }}
          path: ${{ runner.temp }}/android-surfaces-${{ matrix.name }}
          if-no-files-found: warn

  studio-plugin:
    name: Android Studio plugin
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Test and build plugin
        working-directory: shadowdroid-plugin
        run: ./gradlew --no-daemon test buildPlugin verifyPluginStructure
